name: broccoli-svg-optimizer CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint_and_test:
    name: Lint and test - Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest Node versions allowed by engines, and the current one.
        node: ['20.19', '22.12', '24']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test
        working-directory: packages/broccoli-svg-optimizer
        run: |
          pnpm lint
          pnpm test
