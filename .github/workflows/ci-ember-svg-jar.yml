name: ember-svg-jar CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: packages/ember-svg-jar
        run: pnpm lint

  test:
    name: Tests - Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        # The oldest Node versions allowed by engines, and the current one.
        include:
          - os: ubuntu-latest
            node: '20.19'
          - os: ubuntu-latest
            node: '22.12'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: packages/ember-svg-jar
        run: |
          pnpm test:node
          pnpm test:ember --launch Chrome

  floating-dependencies:
    name: Floating Dependencies
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --no-prefer-frozen-lockfile

      - name: Test
        working-directory: packages/ember-svg-jar
        run: |
          pnpm test:node
          pnpm test:ember --launch Chrome

  try-scenarios:
    name: Tests - ${{ matrix.ember-try-scenario }}
    runs-on: ubuntu-latest
    needs: test
    # Beta and canary can break from upstream changes, so their failures are
    # shown but do not fail the workflow.
    continue-on-error: ${{ matrix.ember-try-scenario == 'ember-beta' || matrix.ember-try-scenario == 'ember-canary' }}

    strategy:
      fail-fast: false
      matrix:
        ember-try-scenario:
          [
            ember-lts-3.28,
            ember-lts-4.12,
            ember-lts-5.12,
            ember-lts-6.8,
            ember-lts-6.12,
            ember-release,
            ember-beta,
            ember-canary,
            embroider-safe,
            embroider-optimized,
          ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        env:
          EMBER_TRY_SCENARIO: ${{ matrix.ember-try-scenario }}
        working-directory: packages/ember-svg-jar
        run: pnpm exec ember try:one $EMBER_TRY_SCENARIO
